# Chạy frontend và backend với Neon đã được cấu hình trong .env.
# Dùng: docker compose -f compose.neon.yaml up --build
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FrontendOrigin: http://localhost:3000
      InitializeDatabase: "false"
      SeedSampleProducts: "false"
      SeedDevelopmentUsers: "false"
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY (at least 32 bytes)}
      Authentication__Jwt__Issuer: se310-api
      Authentication__Jwt__Audience: se310-web
    ports:
      - "127.0.0.1:5290:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
